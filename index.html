<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>สถิติฟุตบอลลีกอีสาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://competition.tl.prod.c0d1um.io" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: analyst workbench — sticky top bar, left rail nav on desktop (scrolling tabs on phone), dense bordered panels, mono numerals */
:root{
  --bg:#f1f4f2; --surface:#ffffff; --surface-2:#f2f5f3; --surface-3:#e4eae7; --line:#dde3e0; --line-2:#c7d0cc;
  --text:#111a16; --muted:#55625c; --faint:#86928d;
  --accent:#0b7a4d; --accent-ink:#ffffff; --accent-soft:#ddf0e6;
  --ca:#2457c5; --cb:#b06f06;
  --w:#1a9a55; --d:#8a949e; --l:#cf4339;
  --h1:#0b7a4d; --h2:#2457c5; --h3:#b06f06; --h4:#a2378c; --grey-line:#cbd3cf;
  --q-hi:#1a9a55; --q-mid:#c99412; --q-lo:#cf4339;
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1210; --surface:#131b18; --surface-2:#18221e; --surface-3:#22302a; --line:#25322c; --line-2:#34443d;
    --text:#e5ece8; --muted:#9caaa3; --faint:#6c7a74;
    --accent:#3cc387; --accent-ink:#06120d; --accent-soft:#143126;
    --ca:#7ea6ff; --cb:#e8ac4c;
    --w:#2fb46b; --d:#76808a; --l:#e5625a;
    --h1:#3cc387; --h2:#7ea6ff; --h3:#e8ac4c; --h4:#e07ccf; --grey-line:#34443d;
    --q-hi:#2fb46b; --q-mid:#d9a92c; --q-lo:#e5625a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1210; --surface:#131b18; --surface-2:#18221e; --surface-3:#22302a; --line:#25322c; --line-2:#34443d;
  --text:#e5ece8; --muted:#9caaa3; --faint:#6c7a74;
  --accent:#3cc387; --accent-ink:#06120d; --accent-soft:#143126;
  --ca:#7ea6ff; --cb:#e8ac4c;
  --w:#2fb46b; --d:#76808a; --l:#e5625a;
  --h1:#3cc387; --h2:#7ea6ff; --h3:#e8ac4c; --h4:#e07ccf; --grey-line:#34443d;
  --q-hi:#2fb46b; --q-mid:#d9a92c; --q-lo:#e5625a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 var(--f-body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;letter-spacing:.005em}
.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px}
.sub{display:block;font-size:12px;color:var(--muted);font-weight:400;line-height:1.35}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1380px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.brand{display:flex;gap:11px;align-items:center;min-width:0;margin-right:auto}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
.brand h1{font-size:17px;margin:0;line-height:1.2;font-weight:700}
.brand .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stamp{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.stamp .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.iconbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer}
.iconbtn:hover{background:var(--surface-2)} .iconbtn:disabled{opacity:.5;cursor:wait}
.iconbtn svg{width:15px;height:15px}
.search{position:relative;width:260px;max-width:100%}
.search input{width:100%;padding:7px 12px 7px 32px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface-2);outline:none;font-size:13px}
.search input:focus{border-color:var(--accent);background:var(--surface)}
.search > svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
.search-res{position:absolute;right:0;top:calc(100% + 6px);width:min(380px,calc(100vw - 32px));max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.search-res button{display:flex;width:100%;gap:10px;align-items:center;padding:8px 12px;border:0;background:none;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)}
.search-res button:hover{background:var(--surface-2)}
.search-res .empty{padding:12px;color:var(--muted)}
.topnav{display:none;width:100%;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-10px}
.topnav::-webkit-scrollbar{display:none}
.topnav a{flex:none;display:flex;gap:6px;align-items:center;text-decoration:none;color:var(--muted);padding:8px 11px;border-bottom:2px solid transparent;font-weight:500;font-size:13.5px}
.topnav a.on{color:var(--accent);border-color:var(--accent)}
.topnav svg{width:16px;height:16px}

/* shell */
.shell{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:196px minmax(0,1fr);gap:22px;padding-block:20px 40px;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:grid;gap:2px}
.rail a{display:flex;gap:10px;align-items:center;padding:8px 11px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.rail a:hover{background:var(--surface-3);color:var(--text)}
.rail a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail svg{width:17px;height:17px;flex:none}
.rail-foot{margin-top:14px;padding:12px 11px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);line-height:1.5}
.rail-foot a{display:inline;padding:0;color:var(--muted);text-decoration:underline}
main{min-width:0;display:grid;gap:16px;align-content:start}
footer{max-width:1380px;margin:0 auto;padding-block:0 28px;padding-left:var(--gut-l);padding-right:var(--gut-r);font-size:12px;color:var(--faint)}
footer a{color:var(--faint)}
@media (max-width:1023px){
  .shell{grid-template-columns:minmax(0,1fr);padding-block:14px 32px}
  .rail{display:none} .topnav{display:flex}
  .search{width:100%;order:3}
}

/* page head + panels */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagehead h2{font-size:23px;margin:0;line-height:1.2}
.pagehead p{margin:3px 0 0;color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:11px 16px;border-bottom:1px solid var(--line)}
.ph h3{font-size:15px;margin:0;font-weight:600}
.ph .note{font-size:12px;color:var(--muted)}
.pb{padding:14px 16px}
.pnote{padding:10px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:var(--surface-2)}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
.cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1180px){.cols,.cols.even{grid-template-columns:minmax(0,1fr)}}
.banner{background:var(--surface);border:1px solid var(--q-mid);border-left-width:4px;padding:10px 14px;border-radius:8px;font-size:13px}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:grid;gap:2px;align-content:start;min-width:0}
.kpi .lab{font-size:12px;color:var(--muted)}
.kpi .val{font:600 24px/1.2 var(--f-num);letter-spacing:-.01em}
.kpi .val small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.kpi .foot{font-size:11.5px;color:var(--faint)}
.meter{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;display:flex;margin-top:5px}
.meter i{display:block;height:100%}

/* controls */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:6px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.inp{padding:6px 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);font-size:13px;min-width:0;max-width:100%}
.btn{border:1px solid var(--line-2);background:var(--surface);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{background:var(--surface-2)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:14px;height:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--text)}
.chip.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.filters label{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.fsearch{position:relative;flex:1 1 220px;max-width:320px}
.fsearch input{width:100%;padding-left:30px}
.fsearch svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--faint)}
.count{font-size:12px;color:var(--muted);margin-left:auto}

/* data tables */
.tw{overflow:auto;max-width:100%}
.tw.tall{max-height:72vh}
table.dt{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.dt th,.dt td{padding:7px 10px;white-space:nowrap;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
.dt th{position:sticky;top:0;z-index:2;background:var(--surface-2);font-weight:600;font-size:11.5px;color:var(--muted)}
.dt.has-grp tr.grp th{height:26px;padding:4px 10px;text-align:center;font-size:11px;letter-spacing:.03em;color:var(--faint);border-left:1px solid var(--line)}
.dt.has-grp tr.grp th:first-child{border-left:0}
.dt.has-grp thead tr:not(.grp) th{top:26px}
.dt td.l,.dt th.l{text-align:left} .dt td.c,.dt th.c{text-align:center}
.dt td.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.dt .stk{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line)}
.dt th.stk{z-index:3;background:var(--surface-2)}
.dt tbody tr:hover td{background:var(--surface-2)}
.dt th.sortable{cursor:pointer;user-select:none}
.dt th.sortable:hover{color:var(--text)}
.dt th.sorted{color:var(--accent)}
.dt td.sorted{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.dt tbody tr:last-child td{border-bottom:0}
.dt td.strong{font-weight:700}
.dt td.rk{color:var(--faint)}
.dt .dim{color:var(--faint)}
.mv{font-size:9px;margin-left:3px;vertical-align:1px}
.mv.up{color:var(--w)} .mv.down{color:var(--l)}
.mbar{display:inline-block;width:46px;height:5px;background:var(--surface-3);border-radius:3px;vertical-align:middle;margin-left:8px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--accent)}

/* team / player links */
.tl{border:0;background:none;padding:0;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px;text-align:left;max-width:100%;min-width:0}
.dt .tl{max-width:240px}
.tl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl:hover .nm{color:var(--accent);text-decoration:underline}
.crest{display:inline-grid;place-items:center;border-radius:5px;color:#fff;font-family:var(--f-num);font-weight:600;flex:none;letter-spacing:-.02em}
img.crest{object-fit:contain;border-radius:0}
.dt .pn{max-width:260px}
.pn{border:0;background:none;padding:0;cursor:pointer;text-align:left;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.pn:hover{color:var(--accent);text-decoration:underline}
.pos{display:inline-block;font:600 10.5px var(--f-num);padding:1px 5px;border-radius:4px;background:var(--surface-3);color:var(--muted)}
.form{display:inline-flex;gap:3px;vertical-align:middle}
.f{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:4px;font:600 10.5px var(--f-num);color:#fff}
.f.W{background:var(--w)} .f.D{background:var(--d)} .f.L{background:var(--l)} .f.N{background:var(--surface-3)}
.form.big{gap:4px} .form.big .f{width:26px;height:26px;font-size:12px;border-radius:6px}

/* lists */
.lrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 16px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .rk{color:var(--faint);font:500 12px var(--f-num);text-align:center}
.lrow .v{font:600 15px var(--f-num)}
.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.leaders > div{border-left:1px solid var(--line);min-width:0}
.leaders h4{margin:0;padding:10px 16px 6px;font-size:12.5px;color:var(--muted);font-weight:600}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line)}
.ins > div{background:var(--surface);padding:11px 14px;display:grid;gap:4px;min-width:0}
.ins .k{font-size:12px;color:var(--muted)}
.ins .v{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.ins .v b{font:600 17px var(--f-num);white-space:nowrap}

/* matches */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);gap:10px;align-items:center;padding:9px 16px;border-top:1px solid var(--line)}
.mrow .h{justify-self:end;min-width:0;max-width:100%}
.mrow .h .tl{flex-direction:row-reverse;text-align:right}
.mrow .a{justify-self:start;min-width:0;max-width:100%}
.mrow .win .nm{font-weight:700}
.sc{font:600 14px var(--f-num);text-align:center;background:var(--surface-3);border-radius:6px;padding:3px 0}
.sc.up{background:none;font:500 12px var(--f-num);color:var(--muted)}
.sc.live{background:var(--l);color:#fff}
.mmeta{grid-column:1/-1;text-align:center;font-size:11.5px;color:var(--faint);margin-top:-5px}
.dayhead{padding:7px 16px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);border-top:1px solid var(--line)}
.ph + .dayhead{border-top:0}
@media (max-width:560px){.mrow{grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);gap:6px;padding:9px 10px}.mrow .tl{font-size:12.5px;gap:5px}.dt .tl{max-width:150px}}
.mx{border-collapse:collapse;font-size:12px}
.mx th,.mx td{border:1px solid var(--line);text-align:center}
.mx thead th{font:600 10.5px var(--f-num);color:var(--muted);background:var(--surface-2);padding:6px 4px;min-width:54px}
.mx th.rowh{text-align:left;padding:4px 10px;position:sticky;left:0;z-index:1;background:var(--surface-2);font:500 12px var(--f-body);color:var(--text)}
.mx td{width:54px;height:38px;font:600 13px var(--f-num)}
.mx td.W{background:color-mix(in srgb,var(--w) 24%,var(--surface))}
.mx td.D{background:color-mix(in srgb,var(--d) 22%,var(--surface))}
.mx td.L{background:color-mix(in srgb,var(--l) 22%,var(--surface))}
.mx td.self{background:var(--surface-3)}
.mx td.up{font:400 10.5px var(--f-body);color:var(--faint)}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.legend-row i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--faint);font:11px var(--f-num)}
.chart .axt{fill:var(--muted);font:500 11.5px var(--f-body)}
.chart .lab{font:600 11px var(--f-num)}
.chart .q{fill:var(--faint);font:500 11px var(--f-body)}
.chart .pt{cursor:pointer}
.chart .pt:hover circle{stroke:var(--text);stroke-width:2}
.chartwrap{padding:10px 12px 4px}
.lgnd{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 14px}
.lg{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.lg i{width:12px;height:3px;border-radius:2px;background:var(--grey-line)}
.lg.on{border-color:currentColor;font-weight:600}

/* team header */
.thead{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:16px}
.thead h2{margin:0;font-size:24px;line-height:1.2}
.thead .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:5px;background:var(--surface-3);color:var(--muted)}
.tag b{color:var(--text);font-family:var(--f-num)}
.back{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:600;font-size:13px;justify-self:start}
.share{display:grid;grid-template-columns:minmax(0,1fr) 34px 44px;gap:4px 10px;align-items:center;padding:7px 16px;border-top:1px solid var(--line);font-size:13px}
.share:first-child{border-top:0}
.share .bar{grid-column:1/-1;height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.share .bar i{display:block;height:100%;background:var(--accent)}

/* compare */
.cmp-sel{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end;padding:14px 16px;border-bottom:1px solid var(--line)}
.csel{display:grid;gap:4px;font-size:12px;min-width:0}
.csel select{width:100%;border-width:2px;font-weight:500}
.csel.a span{color:var(--ca)} .csel.b span{color:var(--cb)}
.csel.a select{border-color:var(--ca)} .csel.b select{border-color:var(--cb)}
.cmp-sel .vs{font:700 13px var(--f-num);color:var(--faint);padding-bottom:8px}
.cmp-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px) minmax(0,1fr);gap:14px;padding:14px 16px;align-items:start}
.tside{background:var(--surface-2);border-radius:8px;padding:12px 14px;border-top:3px solid var(--ca);min-width:0}
.tside.b{border-top-color:var(--cb)}
.tside h3{margin:0;font-size:17px;color:var(--ca);line-height:1.3}
.tside.b h3{color:var(--cb)}
.tside .ln{font-size:13px;margin-top:5px}
.tside .formrow{margin:10px 0 6px}

<script>
'use strict';
/* ================= ตั้งค่า ================= */
const CONFIG = {
  zone: 'NORTHEAST',        // โซน: NORTHEAST, NORTH, SOUTH, EAST, WEST, CENTRAL
  tournamentId: null,       // null = หาไทยลีก 3 ฤดูกาลปัจจุบันให้อัตโนมัติ (หรือใส่เลข เช่น 228)
  cacheMinutes: 15,         // เก็บข้อมูลไว้ในเครื่องผู้ชมกี่นาทีก่อนดึงใหม่
};
const API = 'https://competition.tl.prod.c0d1um.io/thaileague/api/';
const SNAPSHOT = window.__SNAPSHOT__ || (window.__SNAPSHOT_C__ ? expandCompact(window.__SNAPSHOT_C__) : null);   // ข้อมูลฝังในหน้า (ใช้เมื่อเปิดในที่ที่ดึงข้อมูลภายนอกไม่ได้)
/* ข้อมูลฝังแบบย่อ: teams = [ชื่อไทย, อังกฤษ, ชื่อย่อ, อันดับ, อันดับก่อน, P, W, D, L, GF, GA, GD, Pts], M = แมตช์คั่นด้วย ; , N = ชื่อนักเตะคั่นด้วย | , P = สถิตินักเตะคั่นด้วย ; */
function expandCompact(o){
  const teams = (o.teams || []).map(t => ({ th: t[0], en: t[1], short: t[2], rank: t[3], prevRank: t[4], official: { p: t[5], w: t[6], d: t[7], l: t[8], gf: t[9], ga: t[10], gd: t[11], pts: t[12] } }));
  const ST = { '0': 'ft', '1': 'ns' }, venues = o.venues || [];
  const R = o.R ? o.R.split('~') : [];
  const matches = o.M ? o.M.split(';').map((r, i) => { const f = r.split(','), rp = R[i] ? decodeReport(R[i]) : {};
    return { round: f[0], date: f[1], time: f[2], home: teams[+f[3]].th, away: teams[+f[4]].th, hs: f[5] === '' ? null : +f[5], as: f[6] === '' ? null : +f[6], status: ST[f[7]] || f[7], venue: venues[+f[8]] || '',
      id: rp.id || null, att: rp.att || null, rep: rp.rep || null }; }) : [];
  const names = o.N ? o.N.split('|') : [];
  const K = ['mp','min','starts','bench','subIn','subOut','goals','assists','yc','rc','cs','conceded','pen','penMiss','og','motm'];
  const players = o.P ? o.P.split(';').map((r, i) => { const f = r.split(',');
    const p = { team: teams[+f[0]].th, no: f[1], name: names[i] || '', pos: f[2], country: f[3] }; K.forEach((k, j) => p[k] = +(f[4 + j] || 0)); return p; }) : [];

  if (SNAPSHOT) { $('#updated').textContent = u ? 'ข้อมูล ณ ' + new Date(u).toLocaleString('th-TH', { dateStyle:'medium', timeStyle:'short' }) : ''; $('#refreshBtn').hidden = true; return; }
  $('#updated').textContent = S.loading ? 'กำลังดึงข้อมูล…' : u ? 'อัปเดต ' + timeAgo(u) : '';
  $('#refreshBtn').disabled = S.loading;
}
function leagueSummary(){
  const pl = S.d.played, n = pl.length;
  const goals = pl.reduce((a, m) => a + m.hs + m.as, 0);
  const hw = pl.filter(m => m.hs > m.as).length, dr = pl.filter(m => m.hs === m.as).length;
  return { n, goals, hw, dr, aw: n - hw - dr,
    total: S.data.matches.filter(m => m.status !== 'cancel').length,
    btts: pl.filter(m => m.hs > 0 && m.as > 0).length, over25: pl.filter(m => m.hs + m.as > 2).length,
    yc: S.data.players.reduce((a, p) => a + p.yc, 0), rc: S.data.players.reduce((a, p) => a + p.rc, 0),
    big: pl.slice().sort((a, b) => Math.abs(b.hs - b.as) - Math.abs(a.hs - a.as) || (b.hs + b.as) - (a.hs + a.as))[0] };
}

function tl(th, size = 20){

const pn = p => `<button class="pn" data-player="${p.id}" title="${esc(p.name)}">${esc(p.name)}</button>`;
function formHtml(list, lg){
  const cells = list.map(x => { const m = x.m;

const panel = (title, body, tools = '', note = '') => `<section class="panel"><div class="ph"><h3>${title}</h3>${tools}</div>${body}${note ? `<div class="pnote">${note}</div>` : ''}</section>`;
const pagehead = (title, sub, tools = '') => `<div class="pagehead"><div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div>${tools}</div>`;
const seg = (key, cur, items) => `<div class="seg" role="tablist">${items.map(([v, l]) => `<button role="tab" aria-selected="${v === cur}" class="${v === cur ? 'on' : ''}" data-set="${key}:${v}">${l}</button>`).join('')}</div>`;
const emptyState = (title, body = '') => `<section class="panel"><div class="empty-state"><b>${esc(title)}</b>${body}</div></section>`;
function maxBy(list, f){ let best = null, bv = -Infinity, ties = 0; list.forEach(x => { const v = f(x); if (v > bv) { bv = v; best = x; ties = 0; } else if (v === bv) ties++; }); return { item: best, v: bv, ties }; }

/* generic sortable data table */
function dataTable(id, cols, rows, def, opt = {}){
  const st = S.sorts[id] || (S.sorts[id] = { k: def.k, dir: def.dir });
  const col = cols.find(c => c.k === st.k && !c.nosort) || cols.find(c => c.k === def.k);
  const gv = c => r => c.v ? c.v(r) : r[c.k];
  if (col) {
    const g = gv(col), dir = col.k === st.k ? st.dir : def.dir;
    rows = rows.slice().sort((a, b) => {
      const x = g(a), y = g(b);
      if (x == null && y == null) return opt.tie ? opt.tie(a, b) : 0;
      if (x == null) return 1; if (y == null) return -1;
      const c = typeof x === 'string' || typeof y === 'string' ? String(x).localeCompare(String(y), 'th') : x === y ? 0 : x < y ? -1 : 1;
      return c * dir || (opt.tie ? opt.tie(a, b) : 0);
    });
  }
  const cls = c => [c.l ? 'l' : c.c ? 'c' : '', !c.l && !c.c ? 'n' : '', c.stk ? 'stk' : '', c.cls || ''].filter(Boolean).join(' ');
  let grp = '';
  if (cols.some(c => c.grp)) {
    const cells = []; let cur, span = 0;
    cols.forEach((c, i) => { const g = c.grp || ''; if (i && g === cur) span++; else { if (i) cells.push([cur, span]); cur = g; span = 1; } });
    cells.push([cur, span]);
    grp = `<tr class="grp">${cells.map(([g, s]) => `<th colspan="${s}">${esc(g)}</th>`).join('')}</tr>`;
  }
  const head = cols.map(c => {
    const on = col && c.k === col.k;
    return `<th class="${cls(c)}${c.nosort ? '' : ' sortable'}${on ? ' sorted' : ''}" ${c.nosort ? '' : `data-sort="${id}" data-key="${c.k}" data-asc="${c.asc ? 1 : 0}"`} title="${esc(c.title || '')}" ${on ? `aria-sort="${st.dir > 0 ? 'ascending' : 'descending'}"` : ''}>${c.label}${on ? (st.dir < 0 ? ' ↓' : ' ↑') : ''}</th>`;
  }).join('');
  const body = rows.map((r, i) => `<tr>${cols.map(c => {
    const v = gv(c)(r);
    return `<td class="${cls(c)}${col && c.k === col.k ? ' sorted' : ''}">${c.f ? c.f(r, v, i) : (v == null ? '<span class="dim">–</span>' : esc(v))}</td>`;
  }).join('')}</tr>`).join('');
  return `<div class="tw${opt.tall ? ' tall' : ''}"><table class="dt${grp ? ' has-grp' : ''}"><thead>${grp}<tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

/* ---------- charts (SVG) ---------- */
function niceStep(raw){ const p = Math.pow(10, Math.floor(Math.log10(raw || 1))), f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }
function lineChart(lines, R, o = {}){
  const W = o.w || chartW(), H = Math.round(W * (W < 500 ? .62 : .46)), ml = 30, mr = o.mr ?? 86, mt = 12, mb = 34;
  const iw = W - ml - mr, ih = H - mt - mb;
  const top = Math.max(3, ...lines.map(l => Math.max(...l.pts)));
  const step = top <= 8 ? 1 : top <= 16 ? 2 : top <= 36 ? 5 : 10;
  const ymax = Math.ceil(top / step) * step;
  const x = i => ml + (R ? i / R * iw : 0), y = v => mt + ih - v / ymax * ih;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || 'กราฟ')}">`;
  for (let v = 0; v <= ymax; v += step) s += `<line class="grid" x1="${ml}" x2="${ml + iw}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${ml - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const xs = R > 12 && W < 520 ? 2 : 1;
  for (let i = 0; i <= R; i += xs) s += `<text class="axis" x="${x(i)}" y="${mt + ih + 16}" text-anchor="middle">${i}</text>`;
  s += `<text class="axt" x="${ml + iw / 2}" y="${H - 2}" text-anchor="middle">นัดที่</text>`;
  const labels = [];
  lines.forEach(l => {
    const d = l.pts.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    s += `<path d="${d}" fill="none" style="stroke:${l.color}" stroke-width="${l.w || 1.5}" ${l.dash ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round" stroke-linecap="round"><title>${esc(l.title || l.label || '')}: ${l.pts[l.pts.length - 1]} แต้ม</title></path>`;
    if (l.dots) l.pts.forEach((v, i) => { if (i) s += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.8" style="fill:${l.color}"/>`; });
    if (l.label) labels.push({ y: y(l.pts[l.pts.length - 1]), t: l.label, c: l.color });
  });
  labels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 13) labels[i].y = labels[i - 1].y + 13;
  labels.forEach(lb => s += `<text class="lab" x="${x(R) + 8}" y="${(lb.y + 4).toFixed(1)}" style="fill:${lb.c}">${esc(lb.t)}</text>`);
  return s + '</svg>';
}
function goalsChart(m){
  const g = m.games;
  if (!g.length) return '<div class="pb muted">ยังไม่มีผลการแข่งขัน</div>';
  const W = chartW(), H = Math.round(W * .36), ml = 26, mr = 8, mt = 16, mb = 36, iw = W - ml - mr, ih = H - mt - mb;
  const mx = Math.max(3, ...g.map(m.gfOf), ...g.map(m.gaOf));
  const mid = mt + ih / 2, k = (ih / 2 - 2) / mx, slot = iw / g.length, bw = Math.min(30, slot * .6);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="ประตูได้และเสียรายนัด">`;
  s += `<line class="grid" x1="${ml}" x2="${ml + iw}" y1="${mid}" y2="${mid}"/>`;
  s += `<text class="axis" x="${ml - 6}" y="${mt + 8}" text-anchor="end">${mx}</text><text class="axis" x="${ml - 6}" y="${mid + 4}" text-anchor="end">0</text><text class="axis" x="${ml - 6}" y="${mt + ih}" text-anchor="end">${mx}</text>`;
  g.forEach((x, i) => {
    const cx = ml + (i + .5) * slot, gf = m.gfOf(x), ga = m.gaOf(x), r = m.res[i];
    const opp = x.home === m.t.th ? x.away : x.home, ha = x.home === m.t.th ? 'เหย้า' : 'เยือน';
    s += `<g><title>นัดที่ ${x.round ?? '-'} · ${ha} พบ ${esc(opp)} · ${gf}-${ga}</title>`;
    if (gf) s += `<rect x="${cx - bw / 2}" y="${mid - gf * k}" width="${bw}" height="${gf * k}" rx="2" style="fill:var(--accent)"/><text class="axis" x="${cx}" y="${mid - gf * k - 4}" text-anchor="middle">${gf}</text>`;
    if (ga) s += `<rect x="${cx - bw / 2}" y="${mid}" width="${bw}" height="${ga * k}" rx="2" style="fill:var(--l)" opacity=".75"/><text class="axis" x="${cx}" y="${mid + ga * k + 12}" text-anchor="middle">${ga}</text>`;
    s += `<rect x="${cx - 7}" y="${H - 30}" width="14" height="14" rx="3" style="fill:var(--${r === 'W' ? 'w' : r === 'D' ? 'd' : 'l'})"/><text x="${cx}" y="${H - 19.5}" text-anchor="middle" style="fill:#fff;font:600 9px var(--f-num)">${r}</text>`;
    s += `<text class="axis" x="${cx}" y="${H - 3}" text-anchor="middle">${x.round ?? ''}</text></g>`;
  });
  return s + '</svg>';
}
function scatter(pts, o){
  const W = chartW(), H = Math.round(W * (W < 500 ? .8 : .58)), ml = 44, mr = 18, mt = 16, mb = 42, iw = W - ml - mr, ih = H - mt - mb;
  const ext = vals => { const a = Math.min(...vals), b = Math.max(...vals), p = (b - a) * .14 || .5; return [Math.max(0, a - p), b + p]; };
  const [x0, x1] = ext(pts.map(p => p.x)), [y0, y1] = ext(pts.map(p => p.y));
  const X = v => ml + (v - x0) / (x1 - x0) * iw, Y = v => mt + (v - y0) / (y1 - y0) * ih;  // แกน Y กลับด้าน: เสียน้อยอยู่บน
  const ticks = (a, b) => { const st = niceStep((b - a) / 5), out = []; for (let v = Math.ceil(a / st) * st; v <= b + 1e-9; v += st) out.push(+v.toFixed(4)); return out; };
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria)}">`;
  ticks(x0, x1).forEach(v => s += `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${mt}" y2="${mt + ih}"/><text class="axis" x="${X(v)}" y="${mt + ih + 15}" text-anchor="middle">${v}</text>`);
  ticks(y0, y1).forEach(v => s += `<line class="grid" x1="${ml}" x2="${ml + iw}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${ml - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`);
  const ax = avg(pts.map(p => p.x)), ay = avg(pts.map(p => p.y));
  s += `<line x1="${X(ax)}" x2="${X(ax)}" y1="${mt}" y2="${mt + ih}" style="stroke:var(--line-2)" stroke-dasharray="4 4"/><line x1="${ml}" x2="${ml + iw}" y1="${Y(ay)}" y2="${Y(ay)}" style="stroke:var(--line-2)" stroke-dasharray="4 4"/>`;
  s += `<text class="q" x="${ml + iw - 4}" y="${mt + 12}" text-anchor="end" style="fill:var(--accent)">${esc(o.qGood)}</text><text class="q" x="${ml + 4}" y="${mt + ih - 6}">${esc(o.qBad)}</text>`;
  s += `<text class="axt" x="${ml + iw / 2}" y="${H - 4}" text-anchor="middle">${esc(o.xl)}</text><text class="axt" transform="translate(12 ${mt + ih / 2}) rotate(-90)" text-anchor="middle">${esc(o.yl)}</text>`;
  pts.forEach(p => {
    const cx = X(p.x), cy = Y(p.y), right = cx < ml + iw - 70;
    s += `<g class="pt" data-team="${esc(p.th)}"><title>${esc(p.title)}</title><circle cx="${cx}" cy="${cy}" r="6" style="fill:var(--accent)"/><text class="lab" x="${right ? cx + 9 : cx - 9}" y="${cy + 4}" text-anchor="${right ? 'start' : 'end'}" style="fill:var(--text)">${esc(p.label)}</text></g>`;
  });
  return s + '</svg>';
}
function radar(axes, sets){
  const W = 380, H = 330, cx = W / 2, cy = H / 2 + 2, R = 108, n = axes.length;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, r) => [cx + Math.cos(ang(i)) * r, cy + Math.sin(ang(i)) * r];
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="เรดาร์เปรียบเทียบ" style="max-width:380px;margin:0 auto">`;
  [.25, .5, .75, 1].forEach(f => s += `<polygon class="grid" fill="none" points="${axes.map((_, i) => pt(i, R * f).map(v => v.toFixed(1)).join(',')).join(' ')}"/>`);
  axes.forEach((a, i) => {
    const [x, y] = pt(i, R), [lx, ly] = pt(i, R + 16), c = Math.cos(ang(i)), sn = Math.sin(ang(i));
    s += `<line class="grid" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    s += `<text class="axt" x="${lx.toFixed(1)}" y="${(ly + (sn > .5 ? 10 : sn < -.5 ? -2 : 4)).toFixed(1)}" text-anchor="${Math.abs(c) < .3 ? 'middle' : c > 0 ? 'start' : 'end'}">${esc(a)}</text>`;
  });
  sets.forEach(st => {
    const ps = st.vals.map((v, i) => pt(i, R * Math.max(.04, Math.min(1, v))));
    s += `<polygon points="${ps.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" style="fill:${st.color};stroke:${st.color}" fill-opacity=".16" stroke-width="2" stroke-linejoin="round"/>`;
    ps.forEach(p => s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" style="fill:${st.color}"/>`);
  });
  return s + '</svg>';
}
const pctRank = (vals, v, inv) => { if (!vals.length) return 0; let below = 0, eq = 0; vals.forEach(x => { if (x === v) eq++; else if (inv ? x > v : x < v) below++; }); return Math.round((below + eq / 2) / vals.length * 100); };

/* ---------- match row ---------- */
function matchRow(m, o = {}){
  const hw = m.played && m.hs > m.as, aw = m.played && m.as > m.hs;
  let sc;
  if (m.played) sc = `<button class="sc" data-match="${m.i}" title="ดูรายงานการแข่งขัน" aria-label="รายงานการแข่งขัน ${esc(m.home)} ${m.hs}-${m.as} ${esc(m.away)}">${m.hs}–${m.as}</button>`;
  else if (m.status === 'live') sc = `<div class="sc live" title="กำลังแข่ง">${esc(m.liveScore)}</div>`;
  else if (m.status === 'cancel') sc = '<div class="sc up">ยกเลิก</div>';
  else sc = `<button class="sc up" data-match="${m.i}" title="ดูใบรายชื่อก่อนแข่ง">${esc(m.time || 'vs')}</button>`;
  const meta = [o.noDate ? '' : m.date ? fmtDate(m.date, true) : '', o.round && m.round != null ? 'นัดที่ ' + m.round : '', o.noVenue ? '' : m.venue].filter(Boolean).join(' · ');
  return `<div class="mrow"><div class="h${hw ? ' win' : ''}">${tl(m.home)}</div>${sc}<div class="a${aw ? ' win' : ''}">${tl(m.away)}</div>${meta ? `<div class="mmeta">${esc(meta)}</div>` : ''}</div>`;
}

    cell('เก่งนอกบ้าน', maxBy(M, m => m.appg), f2, 'แต้ม/นัด'),
    cell('ใบเหลืองมากที่สุด', maxBy(M, m => m.yc), id, 'ใบ'),

  const big = L.big ? `<div class="pnote">ชนะขาดที่สุดฤดูกาลนี้: ${esc(L.big.home)} ${L.big.hs}–${L.big.as} ${esc(L.big.away)} (นัดที่ ${L.big.round ?? '-'}, ${fmtDate(L.big.date)})</div>` : '';
  const lead = (title, k, unit) => {

    return `<div><h4>${title}</h4>${list.map((p, i) => `<div class="lrow"><span class="rk">${i + 1}</span><span style="min-width:0">${pn(p)}<span class="sub">${esc(p.team)}</span></span><span class="v">${p[k]}<small class="muted" style="font:400 11px var(--f-body)"> ${unit}</small></span></div>`).join('') || '<div class="pb muted small">ยังไม่มีข้อมูล</div>'}</div>`;
  };

    ${panel('ผู้นำสถิตินักเตะ', `<div class="leaders">${lead('ดาวซัลโว', 'goals', 'ประตู')}${lead('แอสซิสต์', 'assists', 'ครั้ง')}</div>`, '<a class="note" href="#players" data-tab="players">ดูนักเตะทั้งหมด →</a>')}</div>`;

}
function raceChart(){
  const R = S.d.maxRound;

  S.data.teams.forEach(t => { if (!S.race.includes(t.th)) lines.push({ pts: S.d.race.get(t.th), color: 'var(--grey-line)', w: 1.3, title: t.th }); });
  S.race.forEach((th, i) => { const t = S.d.teamBy.get(th), pts = S.d.race.get(th); if (t && pts) lines.push({ pts, color: `var(--h${i + 1})`, w: 2.6, dots: true, label: `${shortName(t)} ${pts[R]}`, title: t.th }); });
  return lineChart(lines, R, { aria: 'กราฟคะแนนสะสมรายนัดของทุกทีม' });
}

function viewResults(){
  const ms = S.data.matches;
  if (!ms.length) return pagehead('โปรแกรมและผลการแข่งขัน') + emptyState('ยังไม่มีโปรแกรมการแข่งขัน');
  const tools = seg('resMode', S.resMode, [['round','รายนัด'],['matrix','ตารางผลแบบเมทริกซ์']]);
  const html = pagehead('โปรแกรมและผลการแข่งขัน', `แข่งแล้ว ${S.d.played.length} จาก ${ms.filter(m => m.status !== 'cancel').length} นัด`, tools);
  if (S.resMode === 'matrix') return html + viewMatrix();
  const rounds = S.d.rounds;
  if (S.round == null || !rounds.includes(S.round)) S.round = S.d.maxRound || rounds[0];
  const idx = rounds.indexOf(S.round), list = ms.filter(m => m.round === S.round).sort(byOrder), done = list.filter(m => m.played);
  const g = done.reduce((a, m) => a + m.hs + m.as, 0);
  const sum = done.length ? `${done.length} นัด · ${g} ประตู (${f2(g / done.length)} ต่อนัด) · เหย้าชนะ ${done.filter(m => m.hs > m.as).length} เสมอ ${done.filter(m => m.hs === m.as).length} เยือนชนะ ${done.filter(m => m.as > m.hs).length}` : 'นัดนี้ยังไม่ได้แข่ง';
  const nav = `<div style="display:flex;gap:6px;align-items:center"><button class="btn" data-round="${rounds[idx - 1] ?? ''}" ${idx <= 0 ? 'disabled' : ''} aria-label="นัดก่อนหน้า">‹</button>
    <select class="inp" id="roundSel" aria-label="เลือกนัด">${rounds.map(r => `<option value="${r}"${r === S.round ? ' selected' : ''}>นัดที่ ${r}</option>`).join('')}</select>
    <button class="btn" data-round="${rounds[idx + 1] ?? ''}" ${idx >= rounds.length - 1 ? 'disabled' : ''} aria-label="นัดถัดไป">›</button></div>`;
  let body = '', day = '';
  list.forEach(m => { if (m.date !== day) { day = m.date; body += `<div class="dayhead">${fmtDate(m.date, true)}</div>`; } body += matchRow(m, { noDate: true }); });
  return html + panel(`นัดที่ ${S.round}`, body, nav, sum);
}
function viewMatrix(){
  const T = S.d.tables.all.map(r => r.team);
  const key = new Map(); S.data.matches.forEach(m => key.set(m.home + '|' + m.away, m));
  const head = T.map(t => `<th title="${esc(t.th)}">${esc(shortName(t))}</th>`).join('');
  const rows = T.map(h => `<tr><th class="rowh">${tl(h.th, 18)}</th>${T.map(a => {
    if (a.th === h.th) return '<td class="self"></td>';
    const m = key.get(h.th + '|' + a.th);
    if (!m) return '<td class="up">–</td>';
    if (!m.played) return `<td class="up" title="${esc(fmtDate(m.date, true))} · ดูใบรายชื่อ" data-match="${m.i}" style="cursor:pointer">${esc(fmtDate(m.date).replace(/ \d+$/, ''))}</td>`;
    const r = m.hs > m.as ? 'W' : m.hs < m.as ? 'L' : 'D';
    return `<td class="${r}" title="${esc(`${h.th} ${m.hs}-${m.as} ${a.th} · นัดที่ ${m.round}`)}" data-match="${m.i}" style="cursor:pointer">${m.hs}–${m.as}</td>`;
  }).join('')}</tr>`).join('');
  return panel('ตารางผลแบบเมทริกซ์', `<div class="tw"><table class="mx"><thead><tr><th class="rowh">เหย้า \\ เยือน</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`,
    '<div class="legend-row"><span><i style="background:color-mix(in srgb,var(--w) 40%,var(--surface))"></i>เจ้าบ้านชนะ</span><span><i style="background:color-mix(in srgb,var(--d) 40%,var(--surface))"></i>เสมอ</span><span><i style="background:color-mix(in srgb,var(--l) 40%,var(--surface))"></i>ทีมเยือนชนะ</span></div>',
    'แถว = ทีมเหย้า, คอลัมน์ = ทีมเยือน · ช่องที่เป็นวันที่ = ยังไม่แข่ง');
}

function copyPlayers(){
  const st = S.sorts.players || { k:'goals', dir:-1 };
  const col = PCOLS().find(c => c.k === st.k && !c.nosort);
  let rows = filteredPlayers();
  if (col) { const g = p => col.v ? col.v(p) : p[col.k]; rows = rows.slice().sort((a, b) => { const x = g(a), y = g(b); if (x == null) return 1; if (y == null) return -1; return (typeof x === 'string' ? String(x).localeCompare(y, 'th') : x - y) * st.dir; }); }
  const head = ['นักเตะ','ทีม','เบอร์','ตำแหน่ง','สัญชาติ','นัด','ตัวจริง','นาที','% เวลาทีม','ประตู','แอสซิสต์','G+A','จุดโทษ','ประตู/90','แอสซิสต์/90','G+A/90','MOTM','คลีนชีต','ใบเหลือง','ใบแดง'];
  const r2 = v => v == null ? '' : String(Math.round(v * 100) / 100);
  const lines = [head.join('\t')].concat(rows.map(p => [p.name, p.team, p.no, posKey(p.pos), p.country || 'Thailand', p.mp, p.starts, p.min, Math.round(p.x.minPct), p.goals, p.assists, p.ga, p.pen, r2(p.x.g90), r2(p.x.a90), r2(p.x.ga90), p.motm, p.cs, p.yc, p.rc].join('\t')));
  const text = lines.join('\n'), done = () => toast(`คัดลอก ${rows.length} แถวแล้ว วางใน Excel ได้เลย`);
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); ok ? done() : toast('คัดลอกไม่สำเร็จ ลองใหม่อีกครั้ง'); };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
}

  return `<header class="c-head one"><div class="c-mid"><div class="c-league">${esc(S.data.meta.title || 'ไทยลีก 3')}</div><div class="c-title">ตารางคะแนน โซนภาคตะวันออกเฉียงเหนือ</div><div class="c-meta">${S.d.maxRound ? 'หลังจบนัดที่ ' + S.d.maxRound : ''}</div></div></header>
    <div class="c-tbl"><div class="c-tr c-th"><span>#</span><span class="l">สโมสร</span><span>แข่ง</span><span>ชนะ</span><span>เสมอ</span><span>แพ้</span><span>ได้-เสีย</span><span>แต้ม</span><span class="c-form">ฟอร์ม 5 นัด</span></div>
    ${rows.map(r => `<div class="c-tr"><span class="c-pos2">${r.pos}</span><span class="l c-tn">${crest(r.team, 40)}<b>${esc(r.team.th)}</b></span><span>${r.p}</span><span>${r.w}</span><span>${r.d}</span><span>${r.l}</span><span>${sign(r.gd)}</span><span class="c-pts">${r.pts}</span><span class="c-form">${formHtml(S.d.formOf.get(r.team.th) || [], true)}</span></div>`).join('')}</div>
    <footer class="c-foot"><span>สถิติฟุตบอลลีกอีสาน</span><span>ข้อมูลจาก thaileague.co.th</span></footer>`;
}

function gameLogHtml(p){
  const log = playerLog(p);
  if (!log.length) return '';
  const rows = log.map(x => { const m = x.m, home = x.side === 'h', opp = home ? m.away : m.home, gf = home ? m.hs : m.as, ga = home ? m.as : m.hs;
    const res = gf > ga ? 'W' : gf < ga ? 'L' : 'D';
    const evs = x.ev.map(e => `${evIcon(e.t)}<span>${esc(e.min)}'${e.og ? ' (OG)' : ''}</span>`).join(' ');
    return `<tr><td class="n rk">${m.round ?? ''}</td><td class="l"><span class="dim">${home ? 'เหย้า' : 'เยือน'}</span> ${esc(opp)}</td><td class="c"><button class="sc f ${res}" style="width:auto;padding:0 6px" data-match="${m.i}" title="ดูรายงาน">${gf}–${ga}</button></td><td class="l${x.played ? '' : ' dim'}">${x.role}</td><td class="l"><span class="marks" style="display:inline-flex;gap:4px;align-items:center">${evs}</span></td></tr>`; }).join('');
  return `<div class="pctl" style="padding-top:4px"><h4>รายการแข่งขัน</h4><div class="cap">จากรายงานการแข่งขันทางการ · แตะสกอร์เพื่อดูรายงานนัดนั้น</div>
    <div class="tw"><table class="dt"><thead><tr><th>นัด</th><th class="l">คู่แข่ง</th><th class="c">ผล</th><th class="l">บทบาท</th><th class="l">เหตุการณ์</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ---------- search ---------- */
function doSearch(q){
  const box = $('#qres');
  q = q.trim();
  if (!q || !S.data) { box.hidden = true; box.innerHTML = ''; return; }
  const n = norm(q);
  const teams = S.data.teams.filter(t => [t.th, t.en, t.short].some(x => norm(x).includes(n))).slice(0, 4);
  const players = S.data.players.filter(p => [p.name, p.full, p.shirt, p.team].some(x => norm(x).includes(n))).sort((a, b) => b.min - a.min).slice(0, 25);
  box.innerHTML = (teams.map(t => `<button data-team="${esc(t.th)}">${crest(t, 24)}<span>${esc(t.th)}<span class="sub">ทีม</span></span></button>`).join('')
    + players.map(p => `<button data-player="${p.id}">${posTag(p)}<span>${esc(p.name)}<span class="sub">${esc(p.team)} · ${p.mp} นัด · ${p.goals} ประตู</span></span></button>`).join(''))
    || `<div class="empty">ไม่พบ "${esc(q)}"</div>`;
  box.hidden = false;
}

/* ---------- routing & render ---------- */
const VIEWS = { overview: viewOverview, table: viewTable, results: viewResults, players: viewPlayers, teams: viewTeams, compare: viewCompare };
function navHtml(){ return NAV.map(([k, l]) => `<a href="#${k}" data-tab="${k}"${S.tab === k ? ' class="on" aria-current="page"' : ''}>${ICON[k]}<span>${l}</span></a>`).join(''); }
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  S.tab = VIEWS[h] ? h : 'overview';
  render();
}
function render(){
  $('#rail').innerHTML = navHtml() + `<div class="rail-foot">ข้อมูลจาก <a href="https://thaileague.co.th" target="_blank" rel="noopener">thaileague.co.th</a><br>${SNAPSHOT ? 'ข้อมูลชุดที่บันทึกไว้' : 'ดึงข้อมูลสดอัตโนมัติ'}</div>`;
  $('#topnav').innerHTML = navHtml();
  updateStamp();
  if (!S.data) {
    $('#view').innerHTML = S.error
      ? emptyState('ดึงข้อมูลจากไทยลีกไม่สำเร็จ', `<div>${esc(S.error)}</div><div style="margin-top:12px"><button class="btn" data-act="refresh">ลองใหม่</button></div>`)
      : '<section class="panel"><div class="empty-state"><div class="spinner"></div>กำลังดึงข้อมูลจากไทยลีก…</div></section>';
    return;
  }
  const pre = S.error ? `<div class="banner">ดึงข้อมูลล่าสุดไม่สำเร็จ (${esc(S.error)}) กำลังแสดงข้อมูลที่เก็บไว้เมื่อ ${esc(timeAgo(S.data.meta.updated))}</div>` : '';
  $('#view').innerHTML = pre + VIEWS[S.tab]();
}

/* ---------- cache & load ---------- */
function readCache(){ try { const c = JSON.parse(localStorage.getItem(CACHE_KEY)); return c && c.meta && c.teams ? c : null; } catch (e) { return null; } }
function writeCache(raw){ try { localStorage.setItem(CACHE_KEY, JSON.stringify(raw)); } catch (e) {} }
async function load(force){
  if (SNAPSHOT) { setData(SNAPSHOT); route(); return; }
  const cached = readCache();
  if (!S.data && cached) setData(cached);
  if (!force && cached && Date.now() - cached.meta.updated < CONFIG.cacheMinutes * 60000) { S.error = ''; route(); return; }
  S.loading = true; S.error = ''; route();
  try { const raw = await fetchLive(); writeCache(raw); setData(raw); }
  catch (e) { S.error = e.message || String(e); console.error(e); }
  S.loading = false; route();
}

/* ---------- events ---------- */
function goTeam(th){
  if ($('#pm').open) $('#pm').close();
  $('#qres').hidden = true;
  S.team = th || null;
  if (location.hash !== '#teams') location.hash = 'teams'; else route();
  window.scrollTo(0, 0);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-team],[data-player],[data-match],[data-mtab],[data-act],[data-set],[data-sort],[data-round],[data-race],[data-preset]');
  if (!e.target.closest('.search')) $('#qres').hidden = true;
  if (!t) return;
  const ds = t.dataset;
  if (ds.tab) { if (ds.tab === 'teams') S.team = null; if (location.hash === '#' + ds.tab) { e.preventDefault(); route(); } window.scrollTo(0, 0); return; }
  if ('team' in ds) { e.preventDefault(); goTeam(ds.team); return; }
  if ('player' in ds) { $('#qres').hidden = true; openPlayer(ds.player); return; }
  if ('match' in ds) { openMatch(ds.match); return; }
  if (ds.mtab) { openMatch(MM.i, ds.mtab); return; }
  if (ds.set) {
    const [k, v] = ds.set.split(':');
    if (k === 'tableMode') S.tableMode = v; else if (k === 'resMode') S.resMode = v;
    else if (k === 'cmpMode') { S.cmpMode = v; S.cmp = ['', '']; }
    else if (k === 'pos') { S.pf.pos = v; S.pf.preset = ''; }
    render(); return;
  }
  if (ds.sort) {
    const s = S.sorts[ds.sort] || (S.sorts[ds.sort] = { k: ds.key, dir: -1 });
    if (s.k === ds.key) s.dir *= -1; else { s.k = ds.key; s.dir = ds.asc === '1' ? 1 : -1; }
    if (ds.sort === 'players') S.pf.preset = '';
    render(); return;
  }
  if ('round' in ds) { if (ds.round !== '') { S.round = +ds.round; render(); } return; }
  if (ds.race) {
    const i = S.race.indexOf(ds.race);
    if (i >= 0) S.race.splice(i, 1); else { if (S.race.length >= 4) S.race.shift(); S.race.push(ds.race); }
    render(); return;
  }
  if (ds.preset) {
    const pr = PRESETS.find(x => x[0] === ds.preset);
    if (pr) { const o = pr[2]; Object.assign(S.pf, { preset: pr[0], pos: o.pos || '', min: o.min || 0 }); S.sorts.players = { k: o.sort, dir: -1 }; render(); }
    return;
  }
  if (ds.act === 'close') $('#pm').close();
  else if (ds.act === 'refresh') load(true);
  else if (ds.act === 'cast') { $('#pm').close(); castOpen('match'); }
  else if (ds.act === 'cast-table') castOpen('table');
  else if (ds.act === 'cast-close') castClose();
  else if (ds.act === 'cast-fs') castFs();
  else if (ds.act === 'cast-sl' || ds.act === 'cast-rep') { MM.tab = ds.act === 'cast-sl' ? 'sl' : 'rep'; ensureMatch(MM.i); drawCast(); }
  else if (ds.act === 'cast-subs') { CAST.subs = !CAST.subs; drawCast(); }
  else if (ds.act === 'copy') copyPlayers();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'roundSel') { S.round = +t.value; render(); }
  else if (t.id === 'pft') { S.pf.team = t.value; render(); }
  else if (t.id === 'pfm') { S.pf.min = +t.value; S.pf.preset = ''; render(); }
  else if (t.dataset.cmp) { S.cmp[+t.dataset.cmp] = t.value; render(); }
});
document.addEventListener('input', e => { if (e.target.id === 'pfq') { S.pf.q = e.target.value; updatePlayerTable(); } });
$('#pm').addEventListener('click', e => { if (e.target === $('#pm')) $('#pm').close(); });
let qT; $('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => doSearch(e.target.value), 120); });
$('#q').addEventListener('focus', e => e.target.value && doSearch(e.target.value));
$('#q').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; doSearch(''); } });
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => {
  if (!CAST.open) return;
  if (e.key === 'Escape') castClose();
  else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && CAST.mode === 'match' && S.data.matches[MM.i] && S.data.matches[MM.i].played) { MM.tab = MM.tab === 'sl' ? 'rep' : 'sl'; ensureMatch(MM.i); drawCast(); }
  else if (e.key === 'f' || e.key === 'F') castFs();
  else if (e.key === 's' || e.key === 'S') { CAST.subs = !CAST.subs; drawCast(); }
});
document.addEventListener('fullscreenchange', () => { if (CAST.open) setTimeout(drawCast, 120); });
document.addEventListener('mousemove', () => { if (CAST.open) castWake(); });
window.addEventListener('resize', () => { if (CAST.open) fitCast(); });
let rT, lastW = window.innerWidth;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (S.data && Math.abs(window.innerWidth - lastW) > 40 && !(document.activeElement && document.activeElement.matches('input'))) { lastW = window.innerWidth; render(); } }, 250); });
setInterval(updateStamp, 60000);
document.addEventListener('visibilitychange', () => {
  if (!SNAPSHOT && document.visibilityState === 'visible' && S.data && !S.loading && Date.now() - S.data.meta.updated > CONFIG.cacheMinutes * 60000) load(true);
});
load(false);
</script>
</body>
</html>
